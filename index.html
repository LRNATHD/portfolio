<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Noah Smith — Hardware Engineer & PCB Designer</title>
  <meta name="description" content="Portfolio of Noah Smith — hardware engineer specializing in PCB design. Projects, writing, and more." />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <!-- App Icon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3e%3cpath fill='%23646cff' d='M12 2L2 22h20L12 2zm0 3.83L18.17 19H5.83L12 5.83z'/%3e%3c/svg%3e" />

  <!-- External Dependencies -->
  <script type="module" src="https://kicanvas.org/kicanvas/kicanvas.js"></script>

  <!-- Theme: applied BEFORE any CSS loads to prevent flash.
       Inline style background hardcoded so the browser never paints gray. -->
  <script>
    (function() {
      var saved = localStorage.getItem('app-theme');
      if (saved === 'light') {
        document.documentElement.setAttribute('data-theme', 'light');
        document.documentElement.style.background = '#ffffff';
      } else {
        document.documentElement.style.background = '#000000';
      }
    })();
  </script>

  <!-- Styles (render-blocking — must load before paint) -->
  <link rel="stylesheet" href="/src/styles/global.css" />
  <link rel="stylesheet" href="/src/styles/gallery.css" />
  <link rel="stylesheet" href="/src/styles/timeline.css" />
  <link rel="stylesheet" href="/src/styles/pcbs.css" />
  <link rel="stylesheet" href="/src/styles/writing.css" />
  <link rel="stylesheet" href="/src/styles/transitions.css" />
  <link rel="stylesheet" href="/src/styles/about.css" />
</head>
<body>
  <div id="app">
    <nav id="navbar" class="navbar">
      <div class="navbar-inner">
        <a href="#/" class="navbar-brand">noah<span class="accent">smith</span></a>
        <div class="navbar-links">
          <a href="#/" class="nav-link" data-route="projects">Projects</a>
          <a href="#/pcbs" class="nav-link" data-route="pcbs">PCBs</a>
          <a href="#/timeline" class="nav-link" data-route="timeline">PCB Timeline</a>
          <a href="#/about" class="nav-link" data-route="about">About</a>
          <button id="theme-toggle" class="nav-link theme-toggle" aria-label="Toggle theme">
            <span class="theme-icon">☀</span>
          </button>
        </div>
      </div>
    </nav>

    <main id="view-container">
      <!-- Views are injected here by the router -->
    </main>

    <footer id="contact" class="footer footer--compact">
      <div class="footer-links">
        <a href="mailto:hello@example.com" class="footer-link">
          <span class="footer-link-icon">@</span>
          Mail
        </a>
        <a href="https://github.com/LRNATHD" target="_blank" class="footer-link">
          <span class="footer-link-icon">🐙</span>
          GitHub
        </a>
        <a href="https://twitter.com/" target="_blank" class="footer-link">
          <span class="footer-link-icon">𝕏</span>
          Twitter
        </a>
        <a href="https://youtube.com/" target="_blank" class="footer-link">
          <span class="footer-link-icon">▶</span>
          YouTube
        </a>
        <a href="https://instagram.com/" target="_blank" class="footer-link">
          <span class="footer-link-icon">📸</span>
          Instagram
        </a>
      </div>
    </footer>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
