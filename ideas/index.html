<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Print a Project Idea</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="container">
    <header class="topbar">
      <a href="/" class="back-link">&larr; back</a>
      <div class="limits">
        <span id="userQuotaText">3/3 prints left</span>
        <span class="sep">&middot;</span>
        <span id="globalQuotaText">0/400 printed</span>
      </div>
    </header>

    <main class="grid">
      <form id="ideaForm" class="form" novalidate>
        <div class="field">
          <div class="field-head">
            <label for="projectTitle">Title</label>
            <span id="titleCharCount" class="count">0/80</span>
          </div>
          <input
            type="text"
            id="projectTitle"
            placeholder="Toaster that catapults toast onto your plate"
            maxlength="80"
            autocomplete="off"
            required
          />
        </div>

        <div class="field">
          <div class="field-head">
            <label for="projectDescription">Description &amp; details</label>
            <span id="descCharCount" class="count">0/500</span>
          </div>
          <textarea
            id="projectDescription"
            rows="6"
            placeholder="Finds your plate on the table and launches the toast right onto it when it's done."
            maxlength="500"
            required
          ></textarea>
        </div>

        <div class="field">
          <div class="field-head">
            <label for="projectAuthor">Handle</label>
            <span id="authorCharCount" class="count">0/35</span>
          </div>
          <input
            type="text"
            id="projectAuthor"
            placeholder="Anonymous"
            maxlength="35"
            autocomplete="off"
          />
        </div>

        <button type="submit" id="btnSubmitIdea" class="submit-btn">Print</button>
        <p id="statusMsg" class="status-msg"></p>
      </form>

      <div class="preview-col">
        <div class="preview-label">Preview</div>
        <div class="label-card" id="thermalPreviewCard">
          <div class="label-title" id="previewTitle">Toaster that catapults toast onto your plate</div>
          <div class="label-divider"></div>
          <div class="label-desc" id="previewDescription">Finds your plate on the table and launches the toast right onto it when it's done.</div>
          <div class="label-divider"></div>
          <div class="label-footer">
            <div class="label-meta-left">
              <div class="label-handle" id="previewAuthor">Anonymous</div>
              <div class="label-time" id="previewTimestamp">2026-11-05 22:45</div>
            </div>
            <div class="label-number" id="previewNumber">#1 / 400</div>
          </div>
        </div>
      </div>
    </main>

    <footer class="bottom-bar">
      <button type="button" id="btnAdminToggle" class="admin-toggle">admin</button>
    </footer>

    <section id="adminSection" class="admin-section hidden">
      <div class="admin-block">
        <div class="admin-header">
          <span class="admin-title">Postpone Printing</span>
          <span id="postponeStateLabel" class="admin-status">Printing immediately</span>
        </div>

        <div class="postpone-controls">
          <input type="datetime-local" id="postponeInput" class="admin-input" />
          <button type="button" id="btnSetPostpone" class="admin-btn">Set time</button>
          <button type="button" id="btnSleep9am" class="admin-btn">Until 9:00 AM</button>
          <button type="button" id="btnSleep8h" class="admin-btn">+8h</button>
          <button type="button" id="btnHoldIndef" class="admin-btn">Hold all</button>
          <button type="button" id="btnResumeNow" class="admin-btn primary">Resume &amp; print held</button>
        </div>
      </div>

      <div class="admin-block">
        <div class="admin-header">
          <span class="admin-title" id="archiveCountTitle">Saved Prints (0)</span>
          <div class="admin-actions">
            <button type="button" id="btnExportJson" class="admin-btn">Export JSON</button>
          </div>
        </div>
        <div id="archiveList" class="archive-list"></div>
      </div>
    </section>
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
