<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>RealTalk // Thermal Canvas</title>
  <meta name="description" content="Design, rotate and print custom 4x6 labels with ultra-detail dithering to Noah's desk thermal printer." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="app-root">
    <!-- Header -->
    <header class="app-header">
      <div class="header-left">
        <h1 class="app-title">RealTalk</h1>
        <span class="live-pill" id="liveBadge">Desk Printer Live</span>
      </div>
      <div class="header-right" style="display: flex; align-items: center; gap: 10px;">
        <button id="btnToggleHistory" class="btn-history-toggle" type="button" title="View past labels">
          <span>&#128193; Past Labels</span>
          <span id="historyBadge" class="history-count-badge">0</span>
        </button>
        <button id="btnPrint" class="btn-print" title="Print this label to Noah's desk">
          <span class="btn-icon">&#128424;&#65039;</span>
          <span class="btn-label">Print to Desk</span>
        </button>
      </div>
    </header>

    <!-- Toolbar for iPad & Desktop -->
    <nav class="canvas-toolbar">
      <button id="btnAddText" class="tool-btn" type="button">
        <span class="tool-icon">Aa</span>
        <span class="tool-text">Add Text</span>
      </button>

      <label class="tool-btn" for="imageInput" title="Upload an image or photo">
        <span class="tool-icon">&#128444;&#65039;</span>
        <span class="tool-text">Add Image</span>
        <input type="file" id="imageInput" accept="image/*" />
      </label>

      <button id="btnPasteImage" class="tool-btn" type="button" title="Paste from clipboard">
        <span class="tool-icon">&#128203;</span>
        <span class="tool-text">Paste</span>
      </button>

      <button id="btnNewCanvas" class="tool-btn" type="button" title="Start fresh label">
        <span class="tool-icon">&#10024;</span>
        <span class="tool-text">New Label</span>
      </button>

      <button id="btnBgColor" class="tool-btn toggle" type="button" title="Toggle label background color (White / Black)">
        <span class="tool-icon" id="bgIcon">&#9723;</span>
        <span class="tool-text" id="bgColorText">Bg: White</span>
      </button>

      <div class="toolbar-separator"></div>

      <button id="btnDitherMode" class="tool-btn toggle active" type="button" title="Toggle photo dithering vs high-contrast">
        <span class="tool-icon">&#127937;</span>
        <span class="tool-text" id="ditherModeText">Dither: Photo</span>
      </button>

      <button id="btnClear" class="tool-btn danger" type="button" title="Clear canvas">
        <span class="tool-icon">&#128465;&#65039;</span>
        <span class="tool-text">Clear</span>
      </button>
    </nav>

    <!-- Workspace Layout (Stage + History Sidebar) -->
    <div class="workspace-layout">
      <!-- Canvas Workspace Area -->
      <main class="canvas-workspace">
        <div class="canvas-container" id="canvasContainer">
          <!-- 4x6" Interactive Thermal Label Stage (Pure Blank Slate) -->
          <div class="thermal-stage" id="stage">
            <!-- Active elements container -->
            <div id="elementsContainer" class="elements-layer"></div>

            <!-- Bottom subtle corner watermark -->
            <div class="stage-watermark unselectable">made by noahsmith.dev</div>
          </div>
        </div>

        <!-- Quick Tips Hint -->
        <div class="workspace-hint">
          <span>&#128161; Tap anywhere to add text &bull; Paste images with <b>Cmd+V</b> / <b>Ctrl+V</b> &bull; Drag, resize &amp; rotate freely &bull; <b>Backspace</b> to delete</span>
        </div>
      </main>

      <!-- Past Canvases History Sidebar / Drawer -->
      <aside class="history-sidebar" id="historySidebar">
        <div class="history-sidebar-header">
          <div class="history-title">
            <span>&#128193; Past Labels</span>
          </div>
          <button id="btnSidebarClose" class="btn-sidebar-close" type="button" title="Close drawer">&times;</button>
        </div>

        <button id="btnNewCanvasSidebar" class="btn-new-canvas" type="button">
          <span>&#10024; + New Blank Label</span>
        </button>

        <div class="history-list" id="historyContainer">
          <!-- Dynamically populated from localStorage -->
        </div>
      </aside>
    </div>

    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

    <!-- Contextual Element Inspector / Floating Controls -->
    <div id="elementControls" class="element-controls hidden">
      <button id="btnSizeDown" class="control-btn" title="Decrease size">A-</button>
      <button id="btnSizeUp" class="control-btn" title="Increase size">A+</button>
      <div class="control-divider"></div>
      <button id="btnTextColor" class="control-btn" title="Toggle text color (Black / White)">
        <span id="textColorIcon">&#9899;</span>
      </button>
      <button id="btnInvertImage" class="control-btn text-btn" title="Invert image colors (Black &#8596; White)">
        <span>&#9681; Invert</span>
      </button>
      <div class="control-divider"></div>
      <button id="btnRotateCCW" class="control-btn" title="Rotate counter-clockwise 15°">&#8634;</button>
      <span id="rotateDegreeBadge" class="control-btn text-btn" title="Current rotation">0°</span>
      <button id="btnRotateCW" class="control-btn" title="Rotate clockwise 15°">&#8635;</button>
      <button id="btnRotate90" class="control-btn" title="Rotate 90°">90°</button>
      <div class="control-divider"></div>
      <button id="btnAlignLeft" class="control-btn" title="Align left">&#8676;</button>
      <button id="btnAlignCenter" class="control-btn" title="Align center">&#8596;</button>
      <button id="btnAlignRight" class="control-btn" title="Align right">&#8677;</button>
      <div class="control-divider"></div>
      <button id="btnDeleteElem" class="control-btn danger" title="Delete element">&#10005;</button>
    </div>

    <!-- Print Status Modal Overlay -->
    <div id="statusModal" class="status-modal hidden">
      <div class="modal-card">
        <div class="modal-indicator">
          <div class="spinner"></div>
        </div>
        <h3 id="modalTitle" class="modal-title">Transmitting to Noah's Desk...</h3>
        <p id="modalDesc" class="modal-desc">Slicing 4x6 canvas and sending to the phone bridge.</p>
        <div class="modal-progress-track">
          <div id="modalProgressBar" class="modal-progress-bar"></div>
        </div>
        <div class="modal-footer">
          <span id="modalJobId" class="modal-job-id">Job ID: &mdash;</span>
          <button id="modalCloseBtn" class="modal-btn-close hidden" type="button">Dismiss</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
